kind: prompt-section-definition
section: comment
name_definition: >
  "comment" is the operator/recipe/project behavior-adaptation section. Psyche owns
  its configurable body through the closed settings/psyche.json document; the kernel
  owns the section name and render position, and ships no canonical comment body.
purpose: >
  Exists as an injection point so an operator, recipe, or application can adapt the
  general kernel's behavior for the current network/mode by updating Psyche's owner
  document rather than editing kernel-owned sections.
scope:
  owns:
    - Operator/recipe/project-specific behavior adaptation for the current mode.
    - The injection contract that consumes Psyche's comment/comment_file pair.
  does_not_own:
    - The root operating contract (owned by principle).
    - The general action playbook (owned by procedures).
    - The network/avatar rules layer (owned by rules).
    - A durable comment mirror or fallback; an absent owner value removes the section.
injection_contract:
  defined_by: kernel_section_contract
  injected_by: psyche_prompt_owner_document
  content_source: settings_psyche_comment_pair
  override_policy: psyche_owner_pair_may_supply_content
  notes: >
    Psyche resolves comment/comment_file from settings/psyche.json and supplies that
    value directly to the comment section. Unlike base_prompt and covenant, comment is
    not mirrored to system/ and has no durable fallback. It adapts behavior but must
    not override the kernel-owned root contract.
related_files:
  - path: src/lingtai/prompts/ANATOMY.md
    why: >
      The owning prompt-source anatomy: it records comment as a YAML-only,
      Psyche-sourced behavior layer with no mirror or packaged body.
  - path: src/lingtai/agent.py
    why: >
      Owns the concrete composition rule: _reload_prompt_sections() consumes Psyche's
      resolved comment input and writes or removes the `comment` section without a
      durable mirror fallback.
  - path: src/lingtai/tools/psyche/settings.py
    why: >
      Owns the strict settings/psyche.json schema and resolves the
      comment/comment_file pair before prompt composition.
  - path: src/lingtai/prompts/principle/principle.yaml
    why: >
      comment adapts behavior but must not override the root operating contract; edit
      together so an operator adaptation does not silently contradict principle.
  - path: src/lingtai/prompts/procedures/procedures.yaml
    why: >
      comment must not duplicate the general procedures; keep them together so a
      mode-specific adaptation does not restate or fork the kernel playbook.
  - path: src/lingtai/prompts/brief/brief.yaml
    why: >
      brief supplies project context and comment supplies behavior adaptation for the
      same project; edit together so project context and behavior tuning stay distinct.
maintenance:
  - related_files is a progressive-disclosure crawl graph, not a dependency dump: peer section YAMLs for boundary/overlap risk plus the canonical owner/loader files that define the concrete construction rules. Each link explains what rule or boundary its target owns; do not list tests merely because they validate behavior.
  - comment has no kernel body or durable mirror; do not add one. The body relation lives in injection_contract.content_source, so do not point related_files at a concrete prompt `.md` body. `.md` links are reserved for the owning ANATOMY and canonical manual/reference docs, never a prompt body or a test.
  - Keep comment scoped to behavior adaptation; escalate to a kernel-section change if an operator needs to alter the root contract.
