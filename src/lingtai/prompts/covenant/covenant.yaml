kind: prompt-section-definition
section: covenant
name_definition: >
  "covenant" is the protected network-constitution section. Psyche owns its
  configurable body through the closed settings/psyche.json document; the kernel
  owns the section name, protected status, render position, and durable mirror
  fallback contract, but it does not own a canonical covenant body.
purpose: >
  Exists so a network's constitution — act on need, cultivate capability in order to
  help, collaborate with peers, keep durable grain — has a fixed, protected home in
  render order while Psyche provides the network-specific body.
scope:
  owns:
    - The section name `covenant`, its protected status, and its render position.
    - The injection contract that consumes Psyche's covenant/covenant_file pair.
  does_not_own:
    - A kernel-packaged covenant body (there is intentionally no covenant/covenant.md).
    - The root operating principle (owned by principle).
    - The concrete action playbook that covenant norms may trigger (owned by procedures).
injection_contract:
  defined_by: kernel_section_contract
  injected_by: psyche_prompt_owner_document
  content_source: settings_psyche_covenant_pair_with_system_covenant_mirror_fallback
  mirror_path: system/covenant.md
  override_policy: psyche_owner_pair_may_supply_content
  notes: >
    Psyche resolves covenant/covenant_file from settings/psyche.json. A nonempty
    resolved owner value is mirrored to system/covenant.md; when the owner value is
    empty, the existing durable mirror is the fallback. No packaged
    src/lingtai/prompts/covenant/covenant.md body exists. The kernel defines the
    section name, protected status, render position, and mirror behavior only.
related_files:
  - path: src/lingtai/prompts/ANATOMY.md
    why: >
      The owning prompt-source anatomy: it records that covenant is a YAML-only,
      Psyche-sourced section with no packaged body. Read it before treating covenant
      as kernel-owned content.
  - path: src/lingtai/agent.py
    why: >
      Owns the concrete composition rule: _reload_prompt_sections() consumes Psyche's
      resolved covenant input, maintains system/covenant.md as mirror/fallback, and
      writes the protected `covenant` section.
  - path: src/lingtai/tools/psyche/settings.py
    why: >
      Owns the strict settings/psyche.json schema and resolves the
      covenant/covenant_file pair before prompt composition.
  - path: src/lingtai/prompts/principle/principle.yaml
    why: >
      principle names covenant as the constitution; edit together so root operating
      principles and the covenant constitution do not duplicate or contradict each
      other.
  - path: src/lingtai/prompts/procedures/procedures.yaml
    why: >
      covenant norms become operational triggers/checklists in procedures; keep them
      together so a constitution value is not restated as a bare procedure and its
      authorization boundary is preserved.
  - path: src/lingtai/prompts/rules/rules.yaml
    why: >
      network/avatar rules constrain behavior the same way covenant does; edit
      together so a rule does not silently override or duplicate a covenant value.
maintenance:
  - related_files is a progressive-disclosure crawl graph, not a dependency dump: peer section YAMLs for boundary/overlap risk plus the canonical owner/loader files that define the concrete construction rules. Each link explains what rule or boundary its target owns; do not list tests merely because they validate behavior.
  - Do not add a covenant/covenant.md body or list one in related_files; the body source is Psyche's owner document plus the durable mirror fallback recorded in injection_contract.content_source. `.md` links are reserved for the owning ANATOMY and canonical manual/reference docs, never a packaged covenant body or a test.
  - If covenant body ownership ever migrates away from Psyche, that is a separate product decision — update injection_contract deliberately, do not drift.
